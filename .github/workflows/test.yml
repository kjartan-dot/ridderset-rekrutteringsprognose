name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: php -l integrations/wordpress/ridderset-hurtigsjekk/ridderset-hurtigsjekk.php
      - run: php tests/wordpress-brreg-cache.php
